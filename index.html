<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        height: 100dvh;
        background-color: aqua;
        gap: 200px;
      }

      h1 {
        border: 1px solid;
        width: 63px;
        height: 30px;
        color: red;
      }

      h1:hover {
        transform: scale(10);
      }

      .title {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: red;
        background-color: black;
        border-radius: 360px;
        transition: 3s ease-in-out;
        width: 70px;
        height: 70px;
        z-index: 1;
      }

      .title:hover {
        transform: scale(10);
        cursor: pointer;
      }

      .title:active {
        transition: 0s;
        transform: scale(1);
        cursor: pointer;
      }

      .animation {
        scale: 10;
        /* border: 1px solid; */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .an1 {
        animation: rotate 16s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .an2 {
        animation: rotate 8s linear infinite;
      }

      .an3 {
        position: absolute;
        scale: 20;
        animation: rotate 8s linear infinite;
        z-index: 1;
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .outer-ring {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border: 5px solid gray;
        height: 170px;
        width: 170px;
        border-radius: 360px;
      }
    </style>
  </head>

  <body>
    <div class="animation an1">+</div>
    <div class="animation an2">-</div>

    <div class="container">
      <div class="an3">.</div>
      <div class="outer-ring">
        <div class="title" title="This is the title">Title</div>
      </div>
    </div>
  </body>
  (1(
    2(
        3(
            4(
                5
            )
        )
    )
  ))
</html>
